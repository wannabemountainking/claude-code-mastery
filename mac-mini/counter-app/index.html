<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 앱</title>
    <!-- Tailwind CSS를 CDN으로 불러옵니다 (인터넷 연결 필요) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50 flex items-center justify-center p-4">
    <main class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8 text-center">
        <h1 class="text-2xl font-bold text-blue-900 mb-6">카운터</h1>

        <!-- 현재 카운트 표시 -->
        <div id="count" class="text-7xl font-bold text-blue-600 mb-8" aria-live="polite">0</div>

        <!-- 증가 / 감소 버튼 -->
        <div class="flex gap-3 mb-3">
            <button id="decrease"
                class="flex-1 py-3 rounded-xl text-xl font-semibold text-white bg-blue-500 hover:bg-blue-600 active:bg-blue-700 transition-colors">
                -1
            </button>
            <button id="increase"
                class="flex-1 py-3 rounded-xl text-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 active:bg-blue-800 transition-colors">
                +1
            </button>
        </div>

        <!-- 리셋 버튼 -->
        <button id="reset"
            class="w-full py-3 rounded-xl text-lg font-semibold text-blue-700 bg-blue-100 hover:bg-blue-200 active:bg-blue-300 transition-colors">
            리셋
        </button>
    </main>

    <script>
        // 현재 카운트 값을 저장하는 변수
        let count = 0;

        const countEl = document.getElementById('count');

        // 화면의 숫자를 현재 count 값으로 갱신합니다
        function render() {
            countEl.textContent = count;
        }

        document.getElementById('increase').addEventListener('click', () => {
            count += 1;
            render();
        });

        document.getElementById('decrease').addEventListener('click', () => {
            count -= 1;
            render();
        });

        document.getElementById('reset').addEventListener('click', () => {
            count = 0;
            render();
        });
    </script>
</body>
</html>
