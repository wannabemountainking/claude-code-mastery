<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스톱워치 (연습용)</title>
  <!-- Tailwind CSS를 CDN으로 불러옵니다 (인터넷 연결 필요) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- HTML과 스타일은 완성본과 동일합니다. 아래 <script> 안의 TODO만 채워 보세요. -->
<body class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
  <main class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 text-center">

    <h1 class="text-lg font-semibold text-slate-500 mb-4">스톱워치</h1>

    <!-- 시간 표시 영역: JS가 이 안의 글자를 계속 바꿉니다 -->
    <div id="display"
         class="font-mono tabular-nums text-6xl font-bold tracking-wider text-slate-800 my-8">
      00:00:00
    </div>

    <div class="flex gap-4">
      <button id="startPauseBtn"
              class="flex-1 py-3 rounded-xl text-white font-semibold bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition">
        시작
      </button>
      <button id="resetBtn"
              class="flex-1 py-3 rounded-xl font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 active:scale-95 transition">
        리셋
      </button>
    </div>
  </main>

  <script>
    // ===== 상태 변수 (스톱워치의 '기억 장치') - 제공됨 =====
    let startTime = 0;      // 시작 버튼을 누른 시각 (밀리초)
    let elapsedBefore = 0;  // 일시정지 전까지 쌓인 시간 (밀리초)
    let timerId = null;     // setInterval이 돌려준 번호. null이면 멈춘 상태
    let isRunning = false;  // 지금 달리는 중인지 여부

    // ===== 화면 요소 - 제공됨 =====
    const displayEl = document.getElementById('display');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 버튼 색상 클래스 모음 - 제공됨
    const START_COLOR = ['bg-emerald-500', 'hover:bg-emerald-600']; // 초록: "시작" 상태
    const PAUSE_COLOR = ['bg-amber-500', 'hover:bg-amber-600'];     // 주황: "일시정지" 상태

    // ------------------------------------------------------------
    // TODO 1. formatTime
    // 힌트: Math.floor(소수점 버림), % (나머지), String(n).padStart(2, '0') (두 자리 맞춤)
    // ------------------------------------------------------------
    function formatTime(ms) {
      // 입력값: ms (숫자) - 흐른 시간, 밀리초 단위
      // 출력값: 문자열 - 예) 83450 -> '01:23:45' (분:초:1/100초)
      // 내용: 밀리초를 시계 모양 글자로 변환
      // 로직:
      //   1) ms를 10으로 나눠 1/100초 단위 총합(totalCs)을 구한다
      //   2) minutes = totalCs를 6000(60초 x 100)으로 나눈 몫
      //   3) seconds = (totalCs를 100으로 나눈 몫) % 60
      //   4) centis  = totalCs % 100
      //   5) 세 값을 각각 두 자리 문자열로 맞춰 ':'로 이어 붙여 반환
      //
      // ... 작성 공간 ...
    }

    // ------------------------------------------------------------
    // TODO 2. updateDisplay
    // 힌트: Date.now()는 '지금 시각'을 밀리초로 돌려줍니다
    // ------------------------------------------------------------
    function updateDisplay() {
      // 입력값: 없음
      // 출력값: 없음
      // 내용: 지금까지 흐른 총 시간을 계산해 화면에 표시
      // 로직:
      //   1) total = elapsedBefore + (지금 시각 - startTime)
      //   2) total을 formatTime의 인자로 넣어 문자열을 받는다
      //   3) 그 문자열을 displayEl.textContent에 넣는다
      //
      // ... 작성 공간 ...
    }

    // ------------------------------------------------------------
    // TODO 3. handleStartPause
    // 힌트: setInterval(함수, 간격ms) / clearInterval(번호)
    //       classList.remove(...배열) / classList.add(...배열)
    // ------------------------------------------------------------
    function handleStartPause() {
      // 입력값: 없음
      // 출력값: 없음
      // 내용: 멈춘 상태면 시작, 달리는 중이면 일시정지
      // 로직: isRunning 값으로 두 갈래로 나눈다
      //   [시작 - isRunning이 false일 때]
      //     1) startTime에 Date.now()를 저장
      //     2) timerId = setInterval(updateDisplay, 10)  (0.01초마다 갱신)
      //     3) isRunning을 true로
      //     4) 버튼 글자를 '일시정지'로, 색을 START_COLOR -> PAUSE_COLOR로 교체
      //   [일시정지 - isRunning이 true일 때]
      //     1) clearInterval(timerId) 후 timerId를 null로
      //     2) elapsedBefore에 (Date.now() - startTime)을 더해 이번 구간 시간 저장
      //     3) isRunning을 false로
      //     4) 버튼 글자를 '계속'으로, 색을 PAUSE_COLOR -> START_COLOR로 교체
      //
      // ... 작성 공간 ...
    }

    // ------------------------------------------------------------
    // TODO 4. handleReset
    // ------------------------------------------------------------
    function handleReset() {
      // 입력값: 없음
      // 출력값: 없음
      // 내용: 스톱워치를 처음 상태(00:00:00)로 되돌림
      // 로직:
      //   1) clearInterval(timerId) 로 반복을 멈추고 timerId를 null로
      //   2) startTime, elapsedBefore를 0으로, isRunning을 false로
      //   3) 화면 글자를 '00:00:00'으로
      //   4) 버튼 글자를 '시작'으로, 색을 PAUSE_COLOR -> START_COLOR로 되돌림
      //
      // ... 작성 공간 ...
    }

    // ===== 버튼과 함수 연결 (버튼 클릭 -> 함수 실행) - 제공됨 =====
    startPauseBtn.addEventListener('click', handleStartPause);
    resetBtn.addEventListener('click', handleReset);
  </script>
</body>
</html>
