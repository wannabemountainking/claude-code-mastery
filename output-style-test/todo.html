<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO List</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
    }

    button:hover {
      background: #1d4ed8;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #e5e7eb;
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .text {
      flex: 1;
      word-break: break-word;
    }

    li.done .text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-btn {
      padding: 4px 8px;
      background: #ef4444;
      font-size: 12px;
    }

    .delete-btn:hover {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 24px 0;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 14px;
      color: #6b7280;
    }

    .clear-btn {
      background: #6b7280;
      font-size: 12px;
      padding: 6px 10px;
    }

    .clear-btn:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>할 일 목록</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off" />
      <button type="submit">추가</button>
    </form>

    <ul id="todo-list"></ul>
    <div class="empty" id="empty-message">할 일이 없습니다.</div>

    <footer>
      <span id="count"></span>
      <button class="clear-btn" id="clear-done">완료 항목 삭제</button>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "simple-todo-items";

    let todos = loadTodos();

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const emptyMessage = document.getElementById("empty-message");
    const count = document.getElementById("count");
    const clearDoneBtn = document.getElementById("clear-done");

    function loadTodos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch (error) {
        return [];
      }
    }

    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (error) {
        // 저장 공간이 막혀 있어도 화면 동작은 계속되도록 무시합니다.
      }
    }

    function render() {
      list.innerHTML = "";

      todos.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        const text = document.createElement("span");
        text.className = "text";
        text.textContent = todo.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "삭제";
        deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

        li.append(checkbox, text, deleteBtn);
        list.appendChild(li);
      });

      emptyMessage.style.display = todos.length === 0 ? "block" : "none";

      const remaining = todos.filter((todo) => !todo.done).length;
      count.textContent = `남은 할 일: ${remaining} / 전체: ${todos.length}`;
    }

    function addTodo(text) {
      todos.push({ id: Date.now(), text, done: false });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, done: !todo.done } : todo
      );
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      render();
    }

    function clearDone() {
      todos = todos.filter((todo) => !todo.done);
      saveTodos();
      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (text === "") return;
      addTodo(text);
      input.value = "";
      input.focus();
    });

    clearDoneBtn.addEventListener("click", clearDone);

    render();
  </script>
</body>
</html>
