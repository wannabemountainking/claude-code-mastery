<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스톱워치</title>
  <!-- Tailwind CSS를 CDN으로 불러옵니다 (인터넷 연결 필요) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!--
  body 클래스 설명
  - min-h-screen      : 최소 높이를 화면 전체로 (내용이 적어도 배경이 화면을 꽉 채움)
  - flex items-center justify-center : 카드를 화면 정중앙에 배치
  - bg-slate-100      : 연한 회색 배경
-->
<body class="min-h-screen flex items-center justify-center bg-slate-100 p-4">

  <!--
    카드 클래스 설명
    - w-full max-w-sm : 작은 화면에선 꽉 차게, 큰 화면에선 최대 384px
    - bg-white        : 흰색 배경
    - rounded-3xl     : 아주 둥근 모서리
    - shadow-xl       : 큰 그림자 (카드가 떠 있는 느낌)
    - p-8             : 안쪽 여백
  -->
  <main class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 text-center">

    <h1 class="text-lg font-semibold text-slate-500 mb-4">스톱워치</h1>

    <!--
      시간 표시 영역
      - font-mono     : 숫자 폭이 같은 글꼴 (숫자가 바뀌어도 화면이 덜덜 떨리지 않음)
      - tabular-nums  : 숫자 폭을 똑같이 맞춤
      - text-6xl      : 아주 큰 글자
      - tracking-wider: 글자 사이 간격을 넓힘
    -->
    <div id="display"
         class="font-mono tabular-nums text-6xl font-bold tracking-wider text-slate-800 my-8">
      00:00:00
    </div>

    <!-- 버튼 영역: flex로 가로 나열, gap-4로 버튼 사이 간격 -->
    <div class="flex gap-4">
      <!-- 시작/일시정지 버튼: 상태에 따라 글자와 색이 바뀝니다 (JS가 처리) -->
      <button id="startPauseBtn"
              class="flex-1 py-3 rounded-xl text-white font-semibold bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition">
        시작
      </button>

      <!-- 리셋 버튼 -->
      <button id="resetBtn"
              class="flex-1 py-3 rounded-xl font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 active:scale-95 transition">
        리셋
      </button>
    </div>
  </main>

  <script>
    // ===== 상태 변수 (스톱워치의 '기억 장치') =====
    let startTime = 0;      // 시작 버튼을 누른 시각 (밀리초). 출발선에 적어둔 메모
    let elapsedBefore = 0;  // 일시정지 전까지 쌓인 시간 (밀리초). 이전 구간 기록
    let timerId = null;     // setInterval이 돌려준 번호. null이면 멈춘 상태
    let isRunning = false;  // 지금 달리는 중인지 여부

    // ===== 화면 요소 (HTML의 id로 찾아 둡니다) =====
    const displayEl = document.getElementById('display');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 버튼에 적용할 색상 클래스 모음 (바꿀 때 한꺼번에 빼고 넣기 위함)
    const START_COLOR = ['bg-emerald-500', 'hover:bg-emerald-600'];
    const PAUSE_COLOR = ['bg-amber-500', 'hover:bg-amber-600'];

    /**
     * 밀리초를 'MM:SS:CC' 문자열로 바꿉니다.
     * 입력값: ms (숫자) - 흐른 시간, 밀리초 단위
     * 출력값: 문자열 - 예) '01:23:45' (분:초:1/100초)
     * 내용: 숫자를 사람이 읽기 좋은 시계 모양으로 변환
     * 로직: ms를 10으로 나눠 1/100초 단위로 만든 뒤,
     *       분(÷6000), 초(÷100 나머지 60), 1/100초(나머지 100)로 쪼개고
     *       padStart로 두 자리가 되도록 앞에 0을 채움
     */
    function formatTime(ms) {
      const totalCs = Math.floor(ms / 10);        // 1/100초 단위 총합
      const minutes = Math.floor(totalCs / 6000); // 6000 = 60초 × 100
      const seconds = Math.floor(totalCs / 100) % 60;
      const centis = totalCs % 100;

      const pad = (n) => String(n).padStart(2, '0'); // 5 -> '05'
      return `${pad(minutes)}:${pad(seconds)}:${pad(centis)}`;
    }

    /**
     * 화면의 시간을 최신 값으로 갱신합니다.
     * 입력값: 없음
     * 출력값: 없음
     * 내용: 지금까지 흐른 총 시간을 계산해 화면에 표시
     * 로직: 총 시간 = 이전에 쌓인 시간(elapsedBefore) + (지금 시각 - startTime)
     *       이 값을 formatTime에 넣어 나온 문자열을 displayEl에 넣음
     */
    function updateDisplay() {
      const total = elapsedBefore + (Date.now() - startTime);
      displayEl.textContent = formatTime(total);
    }

    /**
     * 시작/일시정지 버튼을 눌렀을 때 실행됩니다.
     * 입력값: 없음
     * 출력값: 없음
     * 내용: 멈춘 상태면 시작하고, 달리는 중이면 일시정지
     * 로직: isRunning 값으로 분기
     *       - 시작: startTime을 지금 시각으로 기록 -> 10ms마다 updateDisplay 반복
     *       - 정지: 반복 중단 -> 이번 구간 시간을 elapsedBefore에 더해 저장
     */
    function handleStartPause() {
      if (!isRunning) {
        // --- 시작 ---
        startTime = Date.now();
        timerId = setInterval(updateDisplay, 10); // 0.01초마다 화면 갱신
        isRunning = true;

        startPauseBtn.textContent = '일시정지';
        startPauseBtn.classList.remove(...START_COLOR);
        startPauseBtn.classList.add(...PAUSE_COLOR);
      } else {
        // --- 일시정지 ---
        clearInterval(timerId);
        timerId = null;
        elapsedBefore += Date.now() - startTime; // 이번 구간 시간을 저장
        isRunning = false;

        startPauseBtn.textContent = '계속';
        startPauseBtn.classList.remove(...PAUSE_COLOR);
        startPauseBtn.classList.add(...START_COLOR);
      }
    }

    /**
     * 리셋 버튼을 눌렀을 때 실행됩니다.
     * 입력값: 없음
     * 출력값: 없음
     * 내용: 스톱워치를 처음 상태(00:00:00)로 되돌림
     * 로직: 반복을 멈추고, 모든 상태 변수를 0/null/false로 초기화,
     *       화면과 버튼 모양도 처음 모습으로 복원
     */
    function handleReset() {
      clearInterval(timerId);
      timerId = null;
      startTime = 0;
      elapsedBefore = 0;
      isRunning = false;

      displayEl.textContent = '00:00:00';
      startPauseBtn.textContent = '시작';
      startPauseBtn.classList.remove(...PAUSE_COLOR);
      startPauseBtn.classList.add(...START_COLOR);
    }

    // ===== 버튼과 함수 연결 (버튼 클릭 -> 함수 실행) =====
    startPauseBtn.addEventListener('click', handleStartPause);
    resetBtn.addEventListener('click', handleReset);
  </script>
</body>
</html>
